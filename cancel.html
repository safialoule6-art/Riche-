<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunami — Paiement annulé</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14b8a6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%2314b8a6'/%3E%3Cpath d='M50 20 C50 20 76 54 76 72 a26 26 0 1 1 -52 0 C24 54 50 20 50 20Z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mascot" viewBox="0 0 120 140">
    <defs><linearGradient id="mgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs>
    <path d="M60 8 C60 8 102 62 102 92 A42 42 0 1 1 18 92 C18 62 60 8 60 8 Z" fill="url(#mgrad)"/>
    <path d="M60 8 C60 8 78 32 88 54 C72 44 52 46 40 60 C46 40 60 8 60 8 Z" fill="#ffffff" opacity="0.18"/>
    <ellipse cx="47" cy="93" rx="12" ry="14" fill="#ffffff"/><ellipse cx="76" cy="93" rx="12" ry="14" fill="#ffffff"/>
    <circle cx="49" cy="96" r="6" fill="#0f2e2b"/><circle cx="74" cy="96" r="6" fill="#0f2e2b"/>
    <circle cx="51" cy="93" r="2.2" fill="#ffffff"/><circle cx="76" cy="93" r="2.2" fill="#ffffff"/>
    <circle cx="33" cy="108" r="6" fill="#ff8a8f" opacity="0.55"/><circle cx="90" cy="108" r="6" fill="#ff8a8f" opacity="0.55"/>
    <path d="M51 113 Q61.5 123 72 113" stroke="#0f2e2b" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="result-wrap">
  <div class="result-card">
    <svg class="mascot idle result-mascot" aria-hidden="true"><use href="#mascot"/></svg>
    <h1>Paiement annulé</h1>
    <p>Pas de souci — tu peux continuer gratuitement, et passer à Super quand tu veux.</p>
    <a class="btn" href="/app">Revenir à mon histoire</a>
  </div>
</div>

<style>
.result-wrap{position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.result-card{text-align:center; max-width:420px; width:100%; background:var(--card); border:2px solid var(--card-border); border-radius:24px; padding:32px 24px; box-shadow:var(--shadow-soft);}
.result-mascot{width:112px; height:128px; margin:0 auto 6px;}
.result-card h1{font-size:28px; margin-bottom:10px;}
.result-card p{color:var(--muted); font-weight:600; margin-bottom:22px; line-height:1.55;}
.result-card .btn{display:inline-block; width:auto; padding:15px 26px; text-decoration:none;}
</style>
</body>
</html>
