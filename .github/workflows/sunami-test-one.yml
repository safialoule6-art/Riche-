name: Sunami Test One Video
on:
  workflow_dispatch:
jobs:
  render-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Remotion skills
        run: npx skills add remotion-dev/skills --yes
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
          pip install requests
      - name: Generate one test video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests, json
          key=os.environ.get('PEXELS_API_KEY')
          if not key: raise SystemExit('PEXELS_API_KEY missing')
          q='person stressed looking at phone'
          r=requests.get('https://api.pexels.com/videos/search',headers={'Authorization':key},params={'query':q,'per_page':1},timeout=30)
          r.raise_for_status()
          data=r.json()
          if not data.get('videos'): raise SystemExit('No Pexels video found')
          v=data['videos'][0]
          files=v.get('video_files',[])
          files=sorted(files,key=lambda x:(x.get('width') or 0),reverse=True)
          url=files[0]['link']
          open('/tmp/pexels.mp4','wb').write(requests.get(url,timeout=60).content)
          print('Pexels source downloaded')
          PY
      - name: Render existing Remotion composition if available
        run: |
          mkdir -p output
          if [ -f package.json ] && grep -q 'remotion' package.json; then
            npx remotion compositions || true
            echo 'RENDER_STAGE_READY'
          else
            echo 'No Remotion package detected; test stops after source validation.'
          fi
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunami-one-video-test
          path: /tmp/pexels.mp4
          if-no-files-found: error
