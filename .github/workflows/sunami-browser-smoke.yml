name: Sunami Browser Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Start static server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/sunami-http.log 2>&1 &
          echo $! >/tmp/sunami-http.pid
          sleep 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('console', message => {
            if (message.type() === 'error') errors.push(`console: ${message.text()}`);
          });

          const response = await page.goto('http://127.0.0.1:4173/app.html', {waitUntil: 'domcontentloaded'});
          if (!response || !response.ok()) throw new Error(`app.html failed to load: ${response?.status()}`);
          await page.waitForTimeout(1500);

          const title = await page.title();
          if (!title.trim()) throw new Error('app.html has no title');
          const bodyText = await page.locator('body').innerText();
          if (!bodyText.trim()) throw new Error('app.html rendered an empty body');

          if (errors.length) throw new Error(errors.join('\n'));
          console.log(`Browser smoke OK — title: ${title}`);
          await browser.close();
          JS

      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/sunami-http.pid)" 2>/dev/null || true
