name: Sunami Agent — QA + TikTok Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'creative*.js'
      - 'creative*.html'
      - 'creative*.css'
      - 'api/pexels*.js'
      - 'agent/**'

permissions:
  contents: read

jobs:
  browser-qa-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open Sunami, test mobile UI and research TikTok Creative Center
        env:
          SUNAMI_URL: https://sunami-rho.vercel.app
        run: python agent/browser_agent.py

      - name: Upload agent evidence
        uses: actions/upload-artifact@v4
        with:
          name: sunami-agent-report
          path: agent/artifacts/
          retention-days: 7
