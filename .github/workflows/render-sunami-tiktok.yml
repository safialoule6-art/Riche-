name: Render Sunami TikTok

on:
  push:
    branches: [creative-remotion-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-engine/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch fresh Pexels clips
        run: node scripts/fetch-clips.mjs

      - name: Start preview server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sunami-vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173 >/dev/null

      - name: Render MP4
        run: npm run render

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunami-tiktok-mp4
          path: video-engine/out/sunami-tiktok.mp4
          if-no-files-found: error
          retention-days: 7
